  /api/learning/dashboard/institution/:
    get:
      operationId: learning_institution_dashboard
      description: 'Retorna a visão consolidada da instituição. Permissão: `coordinator`
        ou `institution_admin` no escopo da própria instituição.'
      parameters:
      - in: query
        name: class_group
        schema:
          type: string
      - in: query
        name: institution_id
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
      tags:
      - Learning Dashboards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstitutionDashboard'
          description: ''
  /api/learning/dashboard/parent/:
    get:
      operationId: learning_parent_dashboard
      description: 'Retorna o dashboard do responsável com os filhos vinculados. Permissão:
        `parent` com assinatura institucional válida.'
      tags:
      - Learning Dashboards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
