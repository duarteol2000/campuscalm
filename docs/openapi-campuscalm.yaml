  /api/auth/register/:
    post:
      operationId: accounts_register
      tags:
      - Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
              examples:
                RegisterResponse:
                  value:
                    user:
                      id: 1
                      email: test@example.com
                      name: Teste
                      phone_number: ''
                      institution: null
                      role: student
                      preferred_language: pt-BR
                      is_active: true
                      created_at: '2026-03-12T10:00:00Z'
                      updated_at: '2026-03-12T10:00:00Z'
                    refresh: jwt-refresh-token
                    access: jwt-access-token
                  summary: Register response
          description: ''
