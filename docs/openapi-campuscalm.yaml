        recommendations:
          type: array
          items:
            type: string
      required:
      - achievements
      - friendly_alerts
      - recommendations
      - score_current
      - score_evolution
      - study_consistency
      - tasks_completed
      - tasks_pending
    StudyAssistantAsk:
      type: object
      properties:
        message:
          type: string
        institution_id:
          type: integer
      required:
      - message
    StudyAssistantResponse:
      type: object
      properties:
        intent:
          type: string
        subject:
          type: string
          nullable: true
        language:
          type: string
        message:
          type: string
      required:
      - intent
      - language
      - message
      - subject
    StudyConsistency:
      type: object
      properties:
        sessions_last_7_days:
          type: integer
        study_days_last_30_days:
          type: integer
        current_streak_days:
          type: integer
      required:
      - current_streak_days
      - sessions_last_7_days
      - study_days_last_30_days
    StudyTaskCompleted:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        completed_at:
          type: string
          format: date-time
      required:
      - completed_at
      - id
      - title
    StudyTaskPending:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        due_date:
          type: string
          format: date
      required:
      - due_date
      - id
      - title
    TargetTypeEnum:
      enum:
      - TASK
      - EVENT
      type: string
      description: |-
        * `TASK` - Tarefa
        * `EVENT` - Evento
    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        due_date:
          type: string
          format: date
        stress_level:
          type: integer
          maximum: 5
          minimum: 1
        status:
          $ref: '#/components/schemas/TaskStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - due_date
      - id
      - stress_level
      - title
    TaskStatusEnum:
      enum:
      - TODO
      - DOING
      - DONE
      type: string
      description: |-
        * `TODO` - A fazer
        * `DOING` - Em andamento
        * `DONE` - Concluída
    TeacherDashboard:
      type: object
      properties:
        class_average:
          type: number
          format: double
        students_at_risk:
          type: array
          items:
            $ref: '#/components/schemas/TeacherStudentRow'
        students_low_consistency:
          type: array
          items:
            $ref: '#/components/schemas/TeacherStudentRow'
        students_good_discipline:
          type: array
          items:
            $ref: '#/components/schemas/TeacherStudentRow'
        pedagogical_insights:
          type: array
          items:
            type: string
        ranking:
          type: array
          items:
            $ref: '#/components/schemas/TeacherStudentRow'
        ranking_pagination:
          $ref: '#/components/schemas/TeacherRankingPagination'
        ranking_filters:
          $ref: '#/components/schemas/TeacherRankingFilters'
        distribution:
          type: array
          items:
            $ref: '#/components/schemas/DisciplineDistributionEntry'
      required:
      - class_average
      - distribution
      - pedagogical_insights
      - ranking
      - ranking_filters
      - ranking_pagination
      - students_at_risk
      - students_good_discipline
      - students_low_consistency
    TeacherRankingFilters:
      type: object
      properties:
        class_group:
          type: string
        search:
          type: string
      required:
      - class_group
      - search
    TeacherRankingPagination:
      type: object
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_items:
          type: integer
        total_pages:
          type: integer
        has_next:
          type: boolean
        has_previous:
          type: boolean
      required:
      - has_next
      - has_previous
      - page
      - page_size
      - total_items
      - total_pages
    TeacherStudentRow:
      type: object
      properties:
        student_id:
          type: integer
        student_name:
          type: string
        class_group:
          type: string
        score_value:
          type: integer
        classification:
          type: string
        weekly_sessions:
          type: integer
        overdue_tasks:
          type: integer
        high_stress_events:
          type: integer
      required:
      - class_group
      - classification
      - high_stress_events
      - overdue_tasks
      - score_value
      - student_id
      - student_name
      - weekly_sessions
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
