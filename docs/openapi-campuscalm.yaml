openapi: 3.0.3
info:
  title: Campus Calm API
  version: 0.1.0
  description: API do MVP Campus Calm
paths:
  /api/access/requests/:
    get:
      operationId: access_requests_list
      tags:
      - Access Requests
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AccessRequest'
          description: ''
    post:
      operationId: access_requests_create
      tags:
      - Access Requests
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AccessRequestCreate'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessRequestCreate'
          description: ''
  /api/access/requests/{id}/:
    get:
      operationId: access_requests_detail
