components:
  schemas:
    Achievement:
      type: object
      properties:
        achievement_type:
          type: string
        title:
          type: string
        description:
          type: string
        unlocked_at:
          type: string
          format: date-time
      required:
      - achievement_type
      - description
      - title
      - unlocked_at
    Assessment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        title:
          type: string
          maxLength: 200
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - created_at
      - id
      - score
      - title
    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        related_task:
          type: integer
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
      - start_at
      - title
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        semester:
          type: integer
        title:
          type: string
          maxLength: 200
        teacher:
          type: string
          maxLength: 200
        credits:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        passing_grade:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/CourseStatusEnum'
          readOnly: true
        final_grade:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        notes:
          type: string
        current_average:
          type: string
          readOnly: true
        progress_percent:
          type: string
          readOnly: true
        needed_to_pass:
          type: string
          readOnly: true
      required:
      - current_average
      - final_grade
      - id
      - needed_to_pass
      - progress_percent
      - semester
      - status
      - title
    CourseStatusEnum:
      enum:
      - IN_PROGRESS
      - PASSED
      - FAILED
      type: string
      description: |-
        * `IN_PROGRESS` - In progress
        * `PASSED` - Passed
        * `FAILED` - Failed
    DisciplineDistributionEntry:
      type: object
      properties:
        classification:
          type: string
        total:
          type: integer
      required:
      - classification
      - total
    EventTypeEnum:
      enum:
      - PROVA
      - ENTREGA
      - APRESENTACAO
      - AULA_IMPORTANTE
      - REUNIAO_GRUPO
      - REUNIAO_PROFESSORES
      - ESTUDAR_FACULDADE
      - OUTRO
      type: string
      description: |-
        * `PROVA` - Prova
        * `ENTREGA` - Entrega
        * `APRESENTACAO` - Apresentacao
        * `AULA_IMPORTANTE` - Aula importante
        * `REUNIAO_GRUPO` - Reuniao em grupo
        * `REUNIAO_PROFESSORES` - Reuniao com professores
        * `ESTUDAR_FACULDADE` - Estudar na faculdade
        * `OUTRO` - Outro
    InstitutionClassRanking:
      type: object
      properties:
        class_group:
          type: string
        average_score:
          type: number
          format: double
        students_total:
          type: integer
      required:
      - average_score
      - class_group
      - students_total
    InstitutionDashboard:
      type: object
      properties:
        institution_average:
          type: number
          format: double
        average_by_class:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionClassRanking'
        students_at_risk:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionStudentRow'
        class_ranking:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionClassRanking'
        discipline_distribution:
          type: array
          items:
            $ref: '#/components/schemas/DisciplineDistributionEntry'
        top_students:
          type: array
          items:
            $ref: '#/components/schemas/InstitutionStudentRow'
        pedagogical_insights:
          type: array
          items:
            type: string
      required:
      - average_by_class
      - class_ranking
      - discipline_distribution
      - institution_average
      - pedagogical_insights
      - students_at_risk
      - top_students
    InstitutionStudentRow:
      type: object
      properties:
        student_id:
          type: integer
        student_name:
          type: string
        class_group:
          type: string
        score_value:
          type: integer
        classification:
          type: string
      required:
      - class_group
      - classification
      - score_value
      - student_id
      - student_name
    MoodEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        mood:
          $ref: '#/components/schemas/MoodEnum'
        notes:
          type: string
        tags: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - mood
    MoodEnum:
      enum:
      - VERY_BAD
      - BAD
      - OK
      - GOOD
      - VERY_GOOD
      type: string
      description: |-
        * `VERY_BAD` - Very bad
        * `BAD` - Bad
        * `OK` - Ok
        * `GOOD` - Good
        * `VERY_GOOD` - Very good
    ParentChildDashboard:
