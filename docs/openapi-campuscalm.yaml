  /api/learning/dashboard/student/:
    get:
      operationId: learning_student_dashboard
      description: 'Retorna o dashboard comportamental do aluno autenticado. Permissão:
        `student` com assinatura institucional válida.'
      tags:
      - Learning Dashboards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentDashboard'
              examples:
                StudentDashboard:
                  value:
                    score_current:
                      score_value: 720
                      classification: disciplinado
                      calculated_at: '2026-03-12T10:00:00Z'
                    score_evolution:
                    - score_value: 680
                      classification: organizado
                      calculated_at: '2026-03-05T10:00:00Z'
                    tasks_pending:
                    - id: 1
                      title: Lista 1
                      due_date: '2026-03-15'
                    tasks_completed: []
                    study_consistency:
                      sessions_last_7_days: 4
                      study_days_last_30_days: 12
                      current_streak_days: 3
                    achievements: []
                    friendly_alerts:
                    - Sua consistência de estudo está baixa nesta semana.
                    recommendations:
                    - Comece com sessões de 25 minutos e pausas curtas de 5 minutos
                      para reconstruir o hábito.
                  summary: Student dashboard
          description: ''
  /api/learning/dashboard/teacher/:
    get:
      operationId: learning_teacher_dashboard
      description: 'Retorna o dashboard pedagógico da turma. Permissão: `teacher`,
        `coordinator` ou `institution_admin` no escopo da própria instituição.'
      parameters:
      - in: query
        name: class_group
        schema:
          type: string
      - in: query
        name: institution_id
        schema:
          type: integer
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
          default: 1
      - in: query
        name: page_size
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 10
      - in: query
        name: search
        schema:
          type: string
      tags:
      - Learning Dashboards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDashboard'
              examples:
                TeacherDashboard:
                  value:
                    class_average: 652.5
                    students_at_risk: []
                    students_low_consistency: []
                    students_good_discipline:
                    - student_id: 10
                      student_name: Ana
                      class_group: A
                      score_value: 780
                      classification: disciplinado
                      weekly_sessions: 5
                      overdue_tasks: 0
                      high_stress_events: 0
                    pedagogical_insights:
                    - Há alunos com baixa consistência de estudo nesta turma.
                    ranking: []
                    ranking_pagination:
                      page: 1
                      page_size: 10
                      total_items: 1
                      total_pages: 1
                      has_next: false
                      has_previous: false
                    ranking_filters:
                      class_group: A
                      search: ''
                    distribution:
                    - classification: disciplinado
                      total: 3
                  summary: Teacher dashboard
          description: ''
