components:
  schemas:
    AITriageLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        model_name:
          type: string
          readOnly: true
        input_payload:
          readOnly: true
        output_payload:
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - input_payload
      - model_name
      - output_payload
    AccessDecision:
      type: object
      properties:
        decided_plan:
          type: string
    AccessRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        requester_email:
          type: string
          format: email
          maxLength: 254
        requester_name:
          type: string
          maxLength: 255
        requester_type:
          $ref: '#/components/schemas/RequesterTypeEnum'
        institution_name:
          type: string
          maxLength: 255
        estimated_users:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        wants_features: {}
        message:
          type: string
        status:
          $ref: '#/components/schemas/AccessRequestStatusEnum'
        recommended_plan:
          oneOf:
          - $ref: '#/components/schemas/PlanCodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        decided_plan:
          oneOf:
          - $ref: '#/components/schemas/PlanCodeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        created_user:
          type: integer
          nullable: true
      required:
      - created_at
      - id
      - requester_email
      - requester_type
      - updated_at
    AccessRequestCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        requester_email:
          type: string
          format: email
          maxLength: 254
        requester_name:
          type: string
          maxLength: 255
        requester_type:
          $ref: '#/components/schemas/RequesterTypeEnum'
        institution_name:
          type: string
          maxLength: 255
        estimated_users:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        wants_features: {}
        message:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/AccessRequestStatusEnum'
          readOnly: true
        recommended_plan:
          allOf:
          - $ref: '#/components/schemas/PlanCodeEnum'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - recommended_plan
      - requester_email
      - requester_type
      - status
    AccessRequestStatusEnum:
      enum:
      - PENDING
      - APPROVED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - Pending
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
    Achievement:
      type: object
      properties:
        achievement_type:
          type: string
        title:
          type: string
        description:
          type: string
        unlocked_at:
          type: string
          format: date-time
      required:
      - achievement_type
      - description
      - title
      - unlocked_at
    Assessment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        course:
          type: integer
        title:
          type: string
          maxLength: 200
        score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        max_score:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        weight:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        date:
          type: string
          format: date
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - course
      - created_at
      - id
      - score
      - title
    BlankEnum:
      enum:
      - ''
    CalendarEvent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        event_type:
          $ref: '#/components/schemas/EventTypeEnum'
        start_at:
          type: string
          format: date-time
        end_at:
          type: string
          format: date-time
          nullable: true
        related_task:
          type: integer
          nullable: true
        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - event_type
      - id
      - start_at
      - title
    CategoryEnum:
      enum:
      - PRE_PROVA
      - ANTI_PROCRASTINACAO
      - FOCO
      type: string
      description: |-
        * `PRE_PROVA` - Pre-prova
        * `ANTI_PROCRASTINACAO` - Anti-procrastinacao
        * `FOCO` - Foco
    ChannelEnum:
      enum:
      - IN_APP
      - EMAIL
      - WHATSAPP
      - SMS
      type: string
      description: |-
        * `IN_APP` - In app
        * `EMAIL` - Email
        * `WHATSAPP` - WhatsApp
        * `SMS` - SMS
    Course:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        semester:
          type: integer
        title:
          type: string
          maxLength: 200
        teacher:
          type: string
          maxLength: 200
        credits:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          nullable: true
        passing_grade:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
        status:
          allOf:
          - $ref: '#/components/schemas/CourseStatusEnum'
          readOnly: true
        final_grade:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        notes:
          type: string
        current_average:
          type: number
